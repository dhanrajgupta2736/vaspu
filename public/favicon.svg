<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Cyber Shield -->
  <path d="M60 8 L104 26 V62 C104 88 60 112 60 112 C60 112 16 88 16 62 V26 L60 8 Z" 
        fill="#070E1E" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Inner Circuit Grid Lines -->
  <path d="M60 22 L60 98" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M30 50 L90 50" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M36 74 L84 74" stroke="rgba(6, 182, 212, 0.2)" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Radar Rings -->
  <circle cx="60" cy="58" r="26" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" fill="none"/>
  <circle cx="60" cy="58" r="14" stroke="rgba(16, 185, 129, 0.6)" stroke-width="1.5" fill="none"/>
  
  <!-- Stylized V-Trace Pathfinder Arrow -->
  <path d="M40 40 L60 76 L80 40" stroke="url(#shieldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M48 40 L60 62 L72 40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blockchain Nodes -->
  <circle cx="40" cy="40" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="80" cy="40" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="60" cy="76" r="5.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="60" cy="22" r="3" fill="#06B6D4"/>
  <circle cx="60" cy="98" r="3" fill="#10B981"/>
</svg>